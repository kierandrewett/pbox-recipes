---
- name: Require a supported desktop package family
  ansible.builtin.assert:
    that: ansible_facts.os_family in ['Debian', 'Archlinux']
    fail_msg: Desktop {{ desktop_session }} supports Debian, Ubuntu, Arch Linux and CachyOS; this guest is {{ ansible_facts.distribution }} ({{ ansible_facts.os_family }}).

- name: Install desktop and VNC dependencies without starting display managers
  ansible.builtin.apt:
    name: "{{ desktop_packages + ['tigervnc-standalone-server', 'dbus-x11', 'x11-utils', 'xauth', 'fonts-dejavu-core', 'python3'] }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
    policy_rc_d: 101

  when: ansible_facts.os_family == 'Debian'

- name: Select Arch desktop packages
  ansible.builtin.set_fact:
    arch_desktop_packages: "{{ desktop_arch_packages + ['tigervnc', 'dbus', 'xorg-xdpyinfo', 'xorg-xauth', 'ttf-dejavu', 'python'] }}"
  when: ansible_facts.os_family == 'Archlinux'

- name: Check for missing Arch desktop packages
  ansible.builtin.command:
    argv: "{{ ['pacman', '-T'] + arch_desktop_packages }}"
  register: missing_desktop_packages
  changed_when: false
  failed_when: missing_desktop_packages.rc not in [0, 127]
  when: ansible_facts.os_family == 'Archlinux'

- name: Install desktop and VNC on Arch Linux
  ansible.builtin.command:
    argv: "{{ ['pacman', '-Syu', '--needed', '--noconfirm'] + arch_desktop_packages }}"
  when:
    - ansible_facts.os_family == 'Archlinux'
    - missing_desktop_packages.rc == 127
  changed_when: true

- name: Require the development account
  ansible.builtin.getent:
    database: passwd
    key: pbox

- name: Create desktop session registration directory
  ansible.builtin.file:
    path: /etc/pbox/desktops
    state: directory
    mode: '0755'

- name: Validate desktop recipe variables
  ansible.builtin.assert:
    that:
      - desktop_session is defined
      - desktop_argv is defined

- name: Register the desktop startup command
  ansible.builtin.copy:
    dest: "/etc/pbox/desktops/{{ desktop_session }}.json"
    content: "{{ {'argv': desktop_argv} | to_json }}\n"
    mode: '0644'

- name: Install the persistent desktop launcher
  ansible.builtin.copy:
    src: pbox-desktop.py
    dest: /usr/local/bin/pbox-desktop
    mode: '0755'

- name: Create LXQt settings directory
  ansible.builtin.file:
    path: /home/pbox/.config/lxqt
    state: directory
    owner: pbox
    group: "{{ getent_passwd.pbox[2] }}"
    mode: '0755'
  when: desktop_session == 'lxqt'

- name: Select Openbox for the managed LXQt session
  ansible.builtin.copy:
    dest: /home/pbox/.config/lxqt/session.conf
    content: "[General]\nwindow_manager=openbox\n"
    owner: pbox
    group: "{{ getent_passwd.pbox[2] }}"
    mode: '0644'
    force: false
  when: desktop_session == 'lxqt'

- name: Verify the desktop starts and accepts VNC connections
  ansible.builtin.command:
    argv: [/usr/local/bin/pbox-desktop, --session, "{{ desktop_session }}"]
  changed_when: false
