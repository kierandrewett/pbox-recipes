recipes:
  desktop/xfce:
    description: XFCE desktop with a persistent VNC session.
    supports: [debian, ubuntu, arch, cachyos]
    capabilities: [desktop]
    desktop: {protocol: vnc, host: 127.0.0.1}
  desktop/mate:
    description: MATE desktop with a persistent VNC session.
    supports: [debian, ubuntu, arch, cachyos]
    capabilities: [desktop]
    desktop: {protocol: vnc, host: 127.0.0.1}
  desktop/lxqt:
    description: LXQt desktop with a persistent VNC session.
    supports: [debian, ubuntu, arch, cachyos]
    capabilities: [desktop]
    desktop: {protocol: vnc, host: 127.0.0.1}
  agent/health:
    path: playbooks/agent/health.yml
    description: Verify the pbox agent binary and its guest service or workspace supervisor.
    capabilities:
      - agent/diagnostics
    supports:
      - systemd
      - openrc
      - runit
      - workspace

  workspace/layout:
    path: playbooks/workspace/layout.yml
    description: Create the standard pbox project, scratch, and user-bin directories.
    capabilities:
      - workspace/layout
    supports:
      - linux

  workspace-tools:
    description: Install common developer tools and prepare the pbox project directory.
    capabilities:
      - workspace/developer-tools
    supports:
      - debian-family
      - fedora-family
      - arch-family
      - suse-family

  dev/base:
    path: playbooks/dev/base.yml
    description: Core command-line tools, compilers and build dependencies for development.
    capabilities: [development/tools]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  browser/firefox:
    path: playbooks/browser/firefox.yml
    description: Install the Firefox desktop browser.
    capabilities: [desktop/browser]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  browser/chromium:
    path: playbooks/browser/chromium.yml
    description: Install the Chromium desktop browser.
    capabilities: [desktop/browser]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  browser/epiphany:
    path: playbooks/browser/epiphany.yml
    description: Install GNOME Web (Epiphany).
    capabilities: [desktop/browser]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  browser/falkon:
    path: playbooks/browser/falkon.yml
    description: Install the Falkon Qt browser.
    capabilities: [desktop/browser]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  browser/brave:
    path: playbooks/browser/brave.yml
    description: Install Brave Browser from its official repository or Arch package.
    capabilities: [desktop/browser]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  browser/vivaldi:
    path: playbooks/browser/vivaldi.yml
    description: Install Vivaldi from its official repository or Arch package.
    capabilities: [desktop/browser]
    supports: [debian-family, arch-family]

  browser/zen:
    path: playbooks/browser/zen.yml
    description: Install Zen Browser for the pbox desktop user.
    capabilities: [desktop/browser]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  browser/helium:
    path: playbooks/browser/helium.yml
    description: Install Helium Browser from its official Linux packages.
    capabilities: [desktop/browser]
    supports: [debian-family, fedora-family, arch-family]

  language/python:
    path: playbooks/language/python.yml
    description: Install Python, pip, virtual environments and development headers.
    capabilities: [development/python]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  language/node:
    path: playbooks/language/node.yml
    description: Install Node.js and npm.
    capabilities: [development/javascript]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  language/rust:
    path: playbooks/language/rust.yml
    description: Install the Rust compiler, Cargo and formatting tools.
    capabilities: [development/rust]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  language/go:
    path: playbooks/language/go.yml
    description: Install the Go compiler and toolchain.
    capabilities: [development/go]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  language/java:
    path: playbooks/language/java.yml
    description: Install the OpenJDK 17 compiler and runtime.
    capabilities: [development/java]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  ide/neovim:
    path: playbooks/ide/neovim.yml
    description: Install Neovim.
    capabilities: [development/editor]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  ide/emacs:
    path: playbooks/ide/emacs.yml
    description: Install Emacs with a graphical desktop build where available.
    capabilities: [development/editor]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  ide/helix:
    path: playbooks/ide/helix.yml
    description: Install the Helix modal editor.
    capabilities: [development/editor]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  ide/vscode:
    path: playbooks/ide/vscode.yml
    description: Install Microsoft Visual Studio Code.
    capabilities: [development/editor]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  ide/zed:
    path: playbooks/ide/zed.yml
    description: Install Zed from its official Linux installer or Arch package.
    capabilities: [development/editor]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  agent/codex:
    path: playbooks/agent/codex.yml
    description: Install the OpenAI Codex coding agent CLI.
    requires: [language/node]
    capabilities: [development/agent]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  agent/claude-code:
    path: playbooks/agent/claude-code.yml
    description: Install the Claude Code coding agent CLI.
    requires: [language/node]
    capabilities: [development/agent]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  agent/gemini-cli:
    path: playbooks/agent/gemini-cli.yml
    description: Install Google's Gemini CLI coding agent.
    requires: [language/node]
    capabilities: [development/agent]
    supports: [debian-family, fedora-family, arch-family, suse-family]

  agent/opencode:
    path: playbooks/agent/opencode.yml
    description: Install the OpenCode open-source coding agent.
    requires: [language/node]
    capabilities: [development/agent]
    supports: [debian-family, fedora-family, arch-family, suse-family]
